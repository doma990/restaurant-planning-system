name: Verify original submissions and browser demo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6'
          cabal-update: false
      - run: python3 tests/check-haskell.py
